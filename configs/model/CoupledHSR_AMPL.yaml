# CoupledHSR on AMPL JD/UB RecBole datasets.
# The AMPL paper fixes hidden dimension=50, max sequence length=50, batch size=128,
# learning rate=0.001, one attention head, dropout=0.5 for AMPL.
# This config follows that scale for fair first comparison.

model: CoupledHSR
MODEL_TYPE: sequential

# Core size
hidden_size: 50
num_layers: 2
n_layers: 2
n_heads: 1
inner_size: 100
MAX_ITEM_LIST_LENGTH: 50

# A6 Hamiltonian residual
use_hnn: True
coupling_mode: causal
hnn_residual_init: -5.0
kernel_size: 3
n_coup_bands: 8

# If your CoupledHSR implementation uses these fields
num_behaviors: 4
funnel_order: [0, 1, 2, 3]

# Optimization
learning_rate: 0.001
epochs: 200
stopping_step: 20
train_batch_size: 128
eval_batch_size: 256
hidden_dropout_prob: 0.5
attn_dropout_prob: 0.5
dropout_prob: 0.5
dropout_rate: 0.5
weight_decay: 0.0
loss_type: CE

# RecBole fields
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
TIME_FIELD: timestamp
load_col:
  inter: [user_id, item_id, timestamp, item_type]
benchmark_filename: [train, valid, test]
train_neg_sample_args: ~

# Full ranking
eval_args:
  split: {'RS': [0, 0, 1]}
  order: TO
  mode: full
metrics: [Recall, NDCG, MRR]
topk: [10, 20]
valid_metric: Recall@10

# Misc
seed: 2026
reproducibility: True
show_progress: True

hyper_parameters: ["hidden_size", "kernel_size", "num_layers", "dropout_prob"]
