# TacoRec / CoupledHSR-v5 safe final config.
# Use this after quick tuning if no better config is selected.

hidden_size: 64
num_layers: 2
n_hnn_layers: 1
num_heads: 1
n_heads: 1
inner_size: 128
dropout_prob: 0.5
hidden_dropout_prob: 0.5
attn_dropout_prob: 0.5
hidden_act: gelu
layer_norm_eps: 1e-12
initializer_range: 0.02

use_transformer: True
use_hnn: True
use_behavior_memory: True
use_target_residual_gate: True
use_interaction_target_behavior: True
causal_anchor: True

coupling_mode: causal
n_coupling_bands: 8
n_coup_bands: 8
coupling_scale: 0.03
kernel_size: 3

hnn_residual_init: -7.0
residual_warmup_steps: 1000
max_residual_scale: 0.2
memory_scale_init: -2.0
alpha_reg: 0.0

loss_type: CE
num_neg: 1
mask_ratio: 0.0
mask_behavior_as_target: True
num_behaviors: 4

learning_rate: 0.0005
train_batch_size: 512
eval_batch_size: 1024
epochs: 200
stopping_step: 20
eval_step: 1
weight_decay: 0.0
learner: adam
train_neg_sample_args: ~

ITEM_TYPE_SEQ_FIELD: item_type_list
ITEM_TYPE_FIELD: item_type
MAX_ITEM_LIST_LENGTH: 50
benchmark_filename: ['train', 'valid', 'test']
alias_of_item_id: ['item_id_list']
alias_of_item_type: ['item_type_list']
field_separator: "\t"
seq_separator: " "
load_col:
  inter: ['user_id', 'item_id_list', 'item_type_list', 'item_length', 'item_id', 'timestamp', 'item_type']

metrics: ['Recall', 'NDCG', 'MRR']
topk: [10, 20]
valid_metric: Recall@10
eval_args:
  order: TO
  mode: full

hyper_parameters: []
show_progress: True
