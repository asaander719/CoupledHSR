# AMPL baseline auto-grid config.
# Use with run_ampl_auto_grid.py.
# Example:
# python run_ampl_auto_grid.py --model AMPL --dataset_prefix ampl_jd \
#   --config_files configs/model/AMPL_GRID.yaml -g 0 \
#   --tune_behavior purchase --run_all_after_tune --stats_level quick

hidden_size: 50
num_layers: [1, 2, 3, 4, 5]
num_heads: 1
inner_size: 50
dropout_prob: 0.5
hidden_dropout_prob: 0.5
attn_dropout_prob: 0.5
hidden_act: relu
layer_norm_eps: 1e-12
initializer_range: 0.02

ITEM_TYPE_SEQ_FIELD: item_type_list
ITEM_TYPE_FIELD: item_type
num_behaviors: 4
target_behavior_token: 4

loss_type: BCE
reg_weight: 0.0

learning_rate: 0.001
learner: adam
train_batch_size: 128
eval_batch_size: 256
epochs: 200
stopping_step: 20
eval_step: 1
weight_decay: 0.0
train_neg_sample_args: ~

MAX_ITEM_LIST_LENGTH: 50
metrics: ['Recall', 'NDCG', 'MRR']
topk: [10, 20]
valid_metric: Recall@10
eval_args:
  order: TO
  mode: full

benchmark_filename: ['train', 'valid', 'test']
alias_of_item_id: ['item_id_list']
alias_of_item_type: ['item_type_list']
field_separator: "\t"
seq_separator: " "
load_col:
  inter: ['user_id', 'item_id_list', 'item_type_list', 'item_length', 'item_id', 'timestamp', 'item_type']

hyper_parameters: ['num_layers']
# learning_rate: [0.001, 0.0005]

# Larger grid example:
# hyper_parameters: ['learning_rate', 'hidden_size', 'dropout_prob', 'loss_type']
# learning_rate: [0.001, 0.0005]
# hidden_size: [30, 50, 64]
# dropout_prob: [0.3, 0.5]
# loss_type: ['BCE', 'BPR']

show_progress: True
