# CoupledHSR scalar base config for ablation.
hidden_size: 50
num_layers: 3 #1
num_heads: 1
n_heads: 1
inner_size: 100
dropout_prob: 0.4
hidden_dropout_prob: 0.5
attn_dropout_prob: 0.5
hidden_act: gelu
layer_norm_eps: 1e-12
initializer_range: 0.02

kernel_size: 3
mask_ratio: 0.0
loss_type: CE

use_transformer: True
use_hnn: True
coupling_mode: causal
n_coupling_bands: 8
n_coup_bands: 8
hnn_residual_init: -5.0
alpha_reg: 0.0
mask_behavior_as_target: True
num_behaviors: 4

ITEM_TYPE_SEQ_FIELD: item_type_list
ITEM_TYPE_FIELD: item_type

learning_rate: 0.0005
train_batch_size: 2048 #128
eval_batch_size: 4096 #256
epochs: 200
stopping_step: 20
eval_step: 1
weight_decay: 0.0
learner: adam
train_neg_sample_args: ~

MAX_ITEM_LIST_LENGTH: 50
metrics: ['Recall', 'NDCG', 'MRR']
topk: [10, 20]
valid_metric: Recall@10
eval_args:
  order: TO
  mode: full

benchmark_filename: ['train', 'valid', 'test']
alias_of_item_id: ['item_id_list']
alias_of_item_type: ['item_type_list']
field_separator: "\t"
seq_separator: " "
load_col:
  inter: ['user_id', 'item_id_list', 'item_type_list', 'item_length', 'item_id', 'timestamp', 'item_type']

hyper_parameters: []
show_progress: True
