gpu_id: 5
seed: 2026 
reproducibility: True

# Dataset / RecBole fields
USER_ID_FIELD: session_id
ITEM_ID_FIELD: item_id
TIME_FIELD: timestamp
load_col: null
benchmark_filename: ['train', 'test']
alias_of_item_id: ['item_id_list']

# Evaluation: clean full ranking
topk: [5, 10, 20]
metrics: ['Recall', 'NDCG', 'MRR']
valid_metric: NDCG@10
eval_args:
  mode: full
  order: TO
customized_eval: 0

# Sequence setup
MAX_ITEM_LIST_LENGTH: 200
mask_ratio: 0.2
loss_type: 'CE'  # 'CE' or 'BPR'
train_neg_sample_args: null
neg_sampling: null

layer_norm_eps: 1e-12
initializer_range: 0.02
hidden_act: 'gelu'
hidden_dropout_prob: 0.10
attn_dropout_prob: 0.10

show_progress: True
save_dataset: False
save_dataloaders: False


# A6 Hamiltonian residual
use_transformer: True
use_hnn: True
n_hnn_layers: 1 # A6: frequency-adaptive causal coupling
n_coup_bands: 8
coupling_scale: 0.10
hnn_residual_init: -5.0     # sigmoid(-5)=0.0067, starts near Transformer-only
mask_behavior_as_target: False

## setting for retail
hidden_size: [64, 128, 256]
kernel_size: [3, 5, 7]
num_layers: [2, 1, 3]
inner_size: 256
n_heads: 2
funnel_order: [2, 3, 1, 4] #[2, 1, 3] #retail  # [0, 3, 1, 2] # Tmall  
num_behaviors: 4 # 0: view, 1: cart, 2: buy. (no fav in retail dataset)
coupling_mode: 'causal' #'none', 'symmetric', 'causal' #
##'none' -> identical to HSR (the C=0 ablation) 'symmetric' -> undirected coupling 'causal' -> lower-triangular (view->fav->cart->buy)   [ours]

train_batch_size: 2048
eval_batch_size: 2048
# dropout_prob: [0.2, 0.1, 0]
# Optimization
epochs: 200
stopping_step: 20
learner: adam
learning_rate: 0.001
weight_decay: 0.0
clip_grad_norm:
  max_norm: 5.0


hyper_parameters: ["hidden_size", "kernel_size", "num_layers", "dropout_prob"]

